name: sowa-chat-dev

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: sowa
      POSTGRES_PASSWORD: sowa
      POSTGRES_DB: sowa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sowa -d sowa"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.2
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3"]
    environment:
      AWS_ACCESS_KEY_ID: sowa-dev
      AWS_SECRET_ACCESS_KEY: sowa-dev-secret
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  valkeydata:
  s3data:
